services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wallet
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management UI — http://localhost:15672 (guest/guest), useful for inspecting deposit_dlq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  wallet-service:
    build: ./wallet-service
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      CLUSTER_WORKERS: 2
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASS: postgres
      PG_DATABASE: wallet
      PG_SYNCHRONIZE: "true"
      AUTH_JWT_SECRET: dev-only-demo-secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DEPOSIT_EXCHANGE: deposit_exchange
      DEPOSIT_ROUTING_KEY: deposit.created
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DEPOSIT_EXCHANGE: deposit_exchange
      DEPOSIT_ROUTING_KEY: deposit.created
      NOTIFICATION_QUEUE: notification_queue
      DEAD_LETTER_QUEUE: deposit_dlq
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  pg_data:
